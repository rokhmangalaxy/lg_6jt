name: Publish logo preview

# Manual only: publishing these competition concepts requires deliberate approval.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logo-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: html
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
