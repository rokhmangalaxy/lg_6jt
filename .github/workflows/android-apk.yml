name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-logo/**', 'html/index.html', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android-logo/**', 'html/index.html', '.github/workflows/android-apk.yml']
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate pull request
        if: github.event_name == 'pull_request'
        working-directory: android-logo
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Restore persistent release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Missing persistent Android signing secrets. See android-logo/RELEASE.md. Never regenerate the key for updates.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mcm-release.jks"
      - name: Build signed release
        if: github.event_name != 'pull_request'
        working-directory: android-logo
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mcm-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Verify signature and publish APK directly
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=android-logo/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" mcm-logo-studio-release.apk
          TAG="android-v${ANDROID_VERSION_NAME}"
          gh release create "$TAG" mcm-logo-studio-release.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MCM Logo Studio ${ANDROID_VERSION_NAME}" \
            --notes "Signed release APK. Package: id.mcm.logopreview. versionCode: ${ANDROID_VERSION_CODE}. Download the .apk asset directly (not source archives)."
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mcm-release.jks"
