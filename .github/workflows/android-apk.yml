name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, arena/1707a542-lg-6jt]
    paths: ['android-logo/**', 'html/index.html', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android-logo/**', 'html/index.html', '.github/workflows/android-apk.yml']
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify geometric logo masters
        run: |
          python3 -m unittest discover -s tests -p 'test*geometric*.py'
          python3 -m unittest discover -s tests -p 'test_variation_vectors.py'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate pull request
        if: github.event_name == 'pull_request'
        working-directory: android-logo
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Prepare fixed public demo signing identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl pkcs8 -inform DER -nocrypt -in android-logo/demo-signing/testkey.pk8 -out "$RUNNER_TEMP/demo-key.pem"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/demo-key.pem" \
            -in android-logo/demo-signing/testkey.x509.pem -name mcm-demo \
            -out "$RUNNER_TEMP/mcm-release.p12" -passout pass:android
      - name: Build signed release
        if: github.event_name != 'pull_request'
        working-directory: android-logo
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mcm-release.p12
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: mcm-demo
          ANDROID_KEY_PASSWORD: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest assembleRelease lintRelease 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Report build diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          log=Path(os.environ['RUNNER_TEMP'])/'android-build.log'
          if log.exists():
              tail='\n'.join(log.read_text(errors='replace').splitlines()[-100:])
              print('::error::'+tail.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          for report in Path('android-logo/app/build/test-results').rglob('TEST-*.xml'):
              for failure in ET.parse(report).iter('failure'):
                  print('::error::'+(failure.text or '')[:5000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYCODE
      - name: Verify packaged logo inventory
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_apk_assets.py android-logo/app/build/outputs/apk/release/app-release.apk
      - name: Verify signature and publish APK directly
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=android-logo/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" mcm-logo-studio-release.apk
          TAG="android-v${ANDROID_VERSION_NAME}"
          gh release create "$TAG" mcm-logo-studio-release.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MCM Logo Studio ${ANDROID_VERSION_NAME}" \
            --notes "PUBLIC DEMO KEY: testing only, not production. Package: id.mcm.logopreview. versionCode: ${ANDROID_VERSION_CODE}. Download the .apk asset directly (not source archives)."
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mcm-release.p12" "$RUNNER_TEMP/demo-key.pem"
