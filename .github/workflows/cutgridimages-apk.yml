name: Build Cut Grid Images APK

on:
  workflow_dispatch:
  push:
    branches: [main, arena/75e1324e-lg-6jt]
    paths:
      - 'cutgridimages/**'
      - '.github/workflows/cutgridimages-apk.yml'
  pull_request:
    paths:
      - 'cutgridimages/**'
      - '.github/workflows/cutgridimages-apk.yml'

permissions:
  contents: read

concurrency:
  group: cutgridimages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install SDK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Unit tests and debug APK
        working-directory: cutgridimages
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      # Lint bersifat informasi: temuan gaya tidak menghalangi artifact APK.
      - name: Lint
        working-directory: cutgridimages
        continue-on-error: true
        run: gradle --no-daemon lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cutgridimages-debug-apk
          path: cutgridimages/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
