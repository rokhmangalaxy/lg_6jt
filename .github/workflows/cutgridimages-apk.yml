name: Build Cut Grid Images APK

on:
  workflow_dispatch:
  push:
    branches: [main, arena/75e1324e-lg-6jt]
    paths:
      - 'cutgridimages/**'
      - '.github/workflows/cutgridimages-apk.yml'
  pull_request:
    paths:
      - 'cutgridimages/**'
      - '.github/workflows/cutgridimages-apk.yml'

permissions:
  contents: write

concurrency:
  group: cutgridimages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install SDK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Unit tests and debug APK
        working-directory: cutgridimages
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 12 build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Build gagal::$line"
            done
            exit "$status"
          fi

      # Lint bersifat informasi: temuan gaya tidak menghalangi artifact APK.
      - name: Lint
        working-directory: cutgridimages
        continue-on-error: true
        run: gradle --no-daemon lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cutgridimages-debug-apk
          path: cutgridimages/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # APK juga diterbitkan sebagai aset Release: unduhan sekali klik dari browser,
      # tanpa perlu masuk ke tab Actions dan mengekstrak ZIP artifact.
      - name: Terbitkan APK ke GitHub Release
        if: github.event_name != 'pull_request'
        working-directory: cutgridimages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c%s "$apk")
          python3 - "$apk" <<'PYEOF' > /tmp/apk-info.txt
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = z.namelist()
              dex = [n for n in names if n.endswith('.dex')]
              print("entries:", len(names))
              print("dex:", ", ".join(f"{n} ({z.getinfo(n).file_size} B)" for n in dex) or "TIDAK ADA")
              print("resources.arsc:", "resources.arsc" in names)
              print("manifest:", "AndroidManifest.xml" in names)
          PYEOF
          cat /tmp/apk-info.txt
          echo "sha256=$sha size=$size"
          while IFS= read -r info; do
            echo "::notice title=APK::$info"
          done < /tmp/apk-info.txt
          echo "::notice title=APK sha256::$sha ($size byte)"
          tag="cutgridimages-v${{ github.run_number }}"
          notes="APK debug otomatis dari commit ${{ github.sha }}. Pasang di perangkat Android 8+ (minSdk 26); izinkan pemasangan dari sumber tidak dikenal bila diminta. Ditandatangani dengan debug keystore milik runner, sehingga APK dari run berbeda harus di-uninstall dulu sebelum dipasang ulang. sha256: $sha"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#app-debug.apk" --clobber
          else
            gh release create "$tag" "$apk#app-debug.apk" \
              --title "Cut Grid Images v${{ github.run_number }}" \
              --notes "$notes" \
              --target "${{ github.sha }}"
          fi
          gh release view "$tag" --json url,assets --jq '.url, (.assets[] | "aset: \(.name) \(.size) byte")'
