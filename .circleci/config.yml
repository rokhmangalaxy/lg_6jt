version: 2.1

# Build Cut Grid Images tanpa memakai kuota GitHub Actions.
# Aktif setelah repository dihubungkan di CircleCI (Projects → Set up Project).
# Image cimg/android sudah memuat JDK 17 + Android SDK; platform 35 dipasang di langkah pertama.

jobs:
  build-cutgridimages:
    docker:
      - image: cimg/android:2024.01.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Pasang Android SDK 35 dan Gradle 8.9
          command: |
            set -euo pipefail
            export PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/cmdline-tools/latest/bin:${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/tools/bin:$PATH"
            if [ ! -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/platforms/android-35" ]; then
              yes | sdkmanager --licenses > /dev/null 2>&1 || true
              sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
            fi
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            echo 'export PATH=/tmp/gradle-8.9/bin:$PATH' >> "$BASH_ENV"
            echo 'export ANDROID_VERSION_CODE=${CIRCLE_BUILD_NUM:-1}' >> "$BASH_ENV"
            echo 'export ANDROID_VERSION_NAME=1.0.${CIRCLE_BUILD_NUM:-1}' >> "$BASH_ENV"
      - run:
          name: Unit test + APK debug
          command: |
            set -euo pipefail
            gradle --version
            cd cutgridimages
            gradle --no-daemon testDebugUnitTest assembleDebug
      - store_artifacts:
          path: cutgridimages/app/build/outputs/apk/debug
          destination: cutgridimages-debug-apk

workflows:
  cutgridimages:
    jobs:
      - build-cutgridimages
